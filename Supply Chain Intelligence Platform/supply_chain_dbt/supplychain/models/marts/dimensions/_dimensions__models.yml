version: 2

models:
  - name: dim_customer
    description: "One row per customer account. Includes revenue tier classification and contract tenure derived fields. Type 1 SCD - current state only."
    columns:
      - name: customer_key
        description: "Surrogate primary key generated from customer_id."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Natural key from source system."
        tests:
          - unique
          - not_null
      - name: customer_name
        description: "Full name of the customer account."
        tests:
          - not_null
      - name: revenue_tier
        description: "Derived revenue classification: Small (<$1M), Medium ($1M-$5M), Large (>$5M)."
        tests:
          - not_null
          - accepted_values:
             arguments:
              values: ['Small', 'Medium', 'Large']
      - name: is_active
        description: "Boolean flag - true if account_status is Active."
        tests:
          - not_null

  - name: dim_driver
    description: "One row per driver per version. Implements SCD Type 2 via dbt snapshot - tracks changes to home_terminal, employment_status, cdl_class, and license_state over time."
    columns:
      - name: driver_key
        description: "Surrogate primary key generated from driver_id. Unique per SCD version."
        tests:
          - unique
          - not_null
      - name: driver_id
        description: "Natural key from source system. Not unique in this table - one driver may have multiple rows for different historical versions."
        tests:
          - not_null
      - name: driver_name
        description: "Full name concatenated from first_name and last_name."
        tests:
          - not_null
      - name: experience_band
        description: "Derived experience classification: Junior (<2yr), Mid (2-5yr), Senior (6-10yr), Veteran (>10yr)."
        tests:
          - not_null
          - accepted_values:
             arguments:
              values: ['Junior', 'Mid', 'Senior', 'Veteran']
      - name: is_active
        description: "Boolean flag - true if employment_status is Active."
        tests:
          - not_null
      - name: is_current
        description: "SCD Type 2 flag - true if this is the current version of the driver record."
        tests:
          - not_null
      - name: valid_from
        description: "SCD Type 2 - date this version of the record became active."
        tests:
          - not_null
      - name: driver_scd_key
        description: "Unique key for each SCD version row, generated by dbt snapshot."
        tests:
          - unique
          - not_null

  - name: dim_truck
    description: "One row per truck per version. Implements SCD Type 2 via dbt snapshot - tracks changes to status, home_terminal, and fuel_type over time."
    columns:
      - name: truck_key
        description: "Surrogate primary key generated from truck_id. Unique per SCD version."
        tests:
          - unique
          - not_null
      - name: truck_id
        description: "Natural key from source system. Not unique in this table due to SCD Type 2."
        tests:
          - not_null
      - name: is_active
        description: "Boolean flag - true if status is Active."
        tests:
          - not_null
      - name: is_current
        description: "SCD Type 2 flag - true if this is the current version of the truck record."
        tests:
          - not_null
      - name: valid_from
        description: "SCD Type 2 - date this version of the record became active."
        tests:
          - not_null
      - name: truck_scd_key
        description: "Unique key for each SCD version row, generated by dbt snapshot."
        tests:
          - unique
          - not_null

  - name: dim_trailer
    description: "One row per trailer. Includes age calculation and active status flag. Type 1 SCD - current state only."
    columns:
      - name: trailer_key
        description: "Surrogate primary key generated from trailer_id."
        tests:
          - unique
          - not_null
      - name: trailer_id
        description: "Natural key from source system."
        tests:
          - unique
          - not_null
      - name: is_active
        description: "Boolean flag - true if status is Active."
        tests:
          - not_null

  - name: dim_facility
    description: "One row per facility including type, location coordinates, and capacity details. Type 1 SCD - current state only."
    columns:
      - name: facility_key
        description: "Surrogate primary key generated from facility_id."
        tests:
          - unique
          - not_null
      - name: facility_id
        description: "Natural key from source system."
        tests:
          - unique
          - not_null
      - name: facility_name
        description: "Full name of the facility."
        tests:
          - not_null
      - name: facility_type
        description: "Category of facility e.g. warehouse, distribution center."
        tests:
          - not_null

  - name: dim_route
    description: "One row per route with origin, destination, rates, and derived haul type classification. Type 1 SCD - current state only."
    columns:
      - name: route_key
        description: "Surrogate primary key generated from route_id."
        tests:
          - unique
          - not_null
      - name: route_id
        description: "Natural key from source system."
        tests:
          - unique
          - not_null
      - name: haul_type
        description: "Derived distance classification: Short Haul (<500mi), Medium Haul (500-1500mi), Long Haul (>1500mi)."
        tests:
          - not_null
          - accepted_values:
             arguments:
              values: ['Short Haul', 'Medium Haul', 'Long Haul']
      - name: route_description
        description: "Human readable origin to destination label e.g. Chicago, IL → Dallas, TX."
        tests:
          - not_null

  - name: dim_date
    description: "Date dimension covering 2022-01-01 through 2027-12-31. Generated using dbt_utils.date_spine. One row per calendar day with year, quarter, month, week, and day attributes plus weekend and current period flags."
    columns:
      - name: date_key
        description: "Surrogate primary key generated from date_day."
        tests:
          - unique
          - not_null
      - name: date_day
        description: "Calendar date - primary key and join key for all fact tables."
        tests:
          - unique
          - not_null
      - name: year
        description: "Calendar year e.g. 2023."
        tests:
          - not_null
      - name: quarter
        description: "Quarter label e.g. Q1, Q2, Q3, Q4."
        tests:
          - not_null
          - accepted_values:
             arguments:
              values: ['Q1', 'Q2', 'Q3', 'Q4']
      - name: is_weekend
        description: "Boolean flag - true if Saturday or Sunday."
        tests:
          - not_null